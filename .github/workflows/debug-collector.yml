name: Debug exchange-rate collector

on:
  pull_request:
    branches: [master]
    paths:
      - "scripts/**"
      - "data/rates.json"
      - ".github/workflows/debug-collector.yml"

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone branch and probe sources
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --quiet --depth 1 --branch "$GITHUB_HEAD_REF" "https://github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          echo "Node: $(node --version)"
          node scripts/debug-sources.mjs
