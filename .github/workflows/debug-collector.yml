name: Validate exchange-rate collector

on:
  pull_request:
    branches: [master]
    paths:
      - "scripts/**"
      - "data/rates.json"
      - ".github/workflows/**"
      - "index.html"
      - "README.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run syntax checks and parser tests
        run: npm run check

      - name: Run live collector
        run: npm run update

      - name: Validate generated data
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("data/rates.json", "utf8"));
            if (data.schemaVersion !== 2) throw new Error("schemaVersion must be 2");
            if (!data.freedom?.length) throw new Error("Freedom observations are empty");
            if (!data.market?.length) throw new Error("MOEX observations are empty");
            const last = data.freedom.at(-1);
            if (last.provider !== "bankffin.kz" || last.source !== "official-api") {
              throw new Error(`Unexpected Freedom source: ${JSON.stringify(last)}`);
            }
            console.log(`Freedom ${last.buy}/${last.sell} at ${last.timestamp}`);
            console.log(`MOEX candles: ${data.market.length}; comparisons: ${data.comparisons?.length ?? 0}`);
          '
