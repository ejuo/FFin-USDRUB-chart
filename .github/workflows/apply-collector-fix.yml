name: Apply collector fix

on:
  push:
    branches: [agent/fix-collector-runtime]
    paths:
      - "scripts/apply-collector-fix.mjs"
      - ".github/workflows/apply-collector-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-collector-runtime
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/apply-collector-fix.mjs

      - name: Commit patched collector
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- scripts/update-rates.mjs; then
            echo "Collector already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update-rates.mjs
          git commit -m "Fix hourly rate collector"
          git push origin "HEAD:agent/fix-collector-runtime"
